<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Aimaam Galaxy Portfolio</title>

<style>

:root{
    --bg:#01020b;
    --bg2:#08051c;
    --cyan:#00f6ff;
    --blue:#398cff;
    --purple:#9147ff;
    --pink:#ff3cac;
    --yellow:#ffe45c;
    --green:#55ffb0;
    --white:#fff;
    --soft:#d9e0ff;
    --muted:#8995bd;
    --panel:rgba(9,14,40,.82);
    --border:rgba(0,246,255,.3);
    --max:1200px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:#fff;
    font-family:"Noto Sans Thai","Segoe UI",Arial,sans-serif;

    background:
        radial-gradient(circle at 20% 10%,rgba(0,246,255,.18),transparent 25%),
        radial-gradient(circle at 80% 20%,rgba(145,71,255,.24),transparent 30%),
        radial-gradient(circle at 50% 75%,rgba(255,60,172,.13),transparent 30%),
        radial-gradient(circle at 50% 50%,#101650 0%,#05051a 40%,#01020b 100%);

    background-attachment:fixed;
}

/* =====================================================
   STAR BACKGROUND
===================================================== */

body:before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-100;
    pointer-events:none;

    background-image:
        radial-gradient(#fff 1px,transparent 1.5px),
        radial-gradient(#00f6ff 1px,transparent 1.5px),
        radial-gradient(#9147ff 1px,transparent 1.7px),
        radial-gradient(#ff3cac 1px,transparent 1.6px);

    background-size:
        65px 65px,
        130px 130px,
        210px 210px,
        310px 310px;

    opacity:.55;

    animation:deepStars 45s linear infinite;
}

@keyframes deepStars{
    to{
        background-position:
            600px 900px,
            -500px 700px,
            700px -500px,
            -800px 300px;
    }
}

/* =====================================================
   NEBULA
===================================================== */

.nebula{
    position:fixed;
    pointer-events:none;
    border-radius:50%;
    filter:blur(55px);
    z-index:-90;
}

.nebula.one{
    width:650px;
    height:650px;
    left:-250px;
    top:5%;
    background:
        radial-gradient(
            circle,
            rgba(0,246,255,.2),
            rgba(0,100,255,.08),
            transparent 70%
        );
    animation:nebulaOne 15s ease-in-out infinite alternate;
}

.nebula.two{
    width:800px;
    height:800px;
    right:-350px;
    top:20%;
    background:
        radial-gradient(
            circle,
            rgba(145,71,255,.22),
            rgba(255,60,172,.08),
            transparent 70%
        );
    animation:nebulaTwo 18s ease-in-out infinite alternate;
}

.nebula.three{
    width:700px;
    height:700px;
    left:35%;
    bottom:-350px;
    background:
        radial-gradient(
            circle,
            rgba(255,60,172,.16),
            rgba(0,246,255,.08),
            transparent 70%
        );
    animation:nebulaThree 20s ease-in-out infinite alternate;
}

@keyframes nebulaOne{
    to{
        transform:
            translate(180px,100px)
            scale(1.25)
            rotate(30deg);
    }
}

@keyframes nebulaTwo{
    to{
        transform:
            translate(-150px,120px)
            scale(1.3)
            rotate(-25deg);
    }
}

@keyframes nebulaThree{
    to{
        transform:
            translate(80px,-150px)
            scale(1.2);
    }
}

/* =====================================================
   GALAXY RING
===================================================== */

.galaxyRing{
    position:fixed;

    width:850px;
    height:280px;

    left:50%;
    top:48%;

    transform:
        translate(-50%,-50%)
        rotate(-18deg);

    border-radius:50%;

    border:
        2px solid rgba(0,246,255,.08);

    box-shadow:
        0 0 60px rgba(0,246,255,.08),
        inset 0 0 60px rgba(145,71,255,.06);

    z-index:-80;
    pointer-events:none;

    animation:galaxySpin 35s linear infinite;
}

.galaxyRing:before,
.galaxyRing:after{
    content:"";
    position:absolute;
    inset:-45px;

    border-radius:50%;

    border:
        1px solid rgba(145,71,255,.08);
}

.galaxyRing:after{
    inset:45px;
    border-color:rgba(255,60,172,.08);
}

@keyframes galaxySpin{
    to{
        transform:
            translate(-50%,-50%)
            rotate(342deg);
    }
}

/* =====================================================
   MOUSE GLOW
===================================================== */

#mouseGlow{
    position:fixed;

    width:350px;
    height:350px;

    border-radius:50%;

    pointer-events:none;

    z-index:9998;

    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(0,246,255,.20),
            rgba(145,71,255,.10),
            transparent 68%
        );

    mix-blend-mode:screen;

    transition:
        width .15s,
        height .15s;
}

/* =====================================================
   MOUSE TRAIL
===================================================== */

.mouseStar{
    position:fixed;

    pointer-events:none;

    z-index:99999;

    font-size:
        var(--size);

    color:
        var(--color);

    text-shadow:
        0 0 5px #fff,
        0 0 10px var(--color),
        0 0 20px var(--color);

    animation:
        trailStar 1s ease-out forwards;
}

@keyframes trailStar{

    0%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(.3)
            rotate(0deg);
    }

    40%{
        opacity:1;
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1);
    }

    100%{
        opacity:0;

        transform:
            translate(
                calc(-50% + var(--x2)),
                calc(-50% + var(--y2))
            )
            scale(.05)
            rotate(180deg);
    }
}

/* =====================================================
   CLICK PARTICLES
===================================================== */

.clickStar{
    position:fixed;

    pointer-events:none;

    z-index:100000;

    font-size:var(--size);

    color:var(--color);

    text-shadow:
        0 0 5px white,
        0 0 10px var(--color),
        0 0 25px var(--color),
        0 0 45px var(--color);

    animation:
        clickExplosion .9s cubic-bezier(.15,.8,.3,1) forwards;
}

@keyframes clickExplosion{

    0%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.2)
            rotate(0deg);
    }

    35%{
        opacity:1;

        transform:
            translate(
                calc(-50% + var(--tx) * .45),
                calc(-50% + var(--ty) * .45)
            )
            scale(1.4)
            rotate(180deg);
    }

    100%{
        opacity:0;

        transform:
            translate(
                calc(-50% + var(--tx)),
                calc(-50% + var(--ty))
            )
            scale(.1)
            rotate(500deg);
    }
}

/* =====================================================
   CLICK RING
===================================================== */

.clickRing{
    position:fixed;

    width:20px;
    height:20px;

    border-radius:50%;

    border:
        2px solid var(--cyan);

    pointer-events:none;

    z-index:99997;

    transform:translate(-50%,-50%);

    box-shadow:
        0 0 10px var(--cyan),
        0 0 25px var(--purple);

    animation:
        ringExplosion .65s ease-out forwards;
}

@keyframes ringExplosion{

    from{
        opacity:1;
        width:20px;
        height:20px;
    }

    to{
        opacity:0;
        width:150px;
        height:150px;
        border-width:1px;
    }
}

/* =====================================================
   FLOATING STARS
===================================================== */

.stars{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:2;
}

.star{
    position:absolute;

    animation:
        starFloat 4s ease-in-out infinite;
}

.s1{
    left:4%;
    top:15%;
    font-size:26px;
}

.s2{
    right:5%;
    top:26%;
    font-size:35px;
    animation-delay:1s;
}

.s3{
    left:8%;
    top:52%;
    font-size:23px;
    animation-delay:2s;
}

.s4{
    right:9%;
    top:72%;
    font-size:30px;
    animation-delay:.6s;
}

.s5{
    left:18%;
    top:86%;
    font-size:21px;
    animation-delay:1.7s;
}

.s6{
    left:42%;
    top:18%;
    font-size:18px;
    animation-delay:.4s;
}

.s7{
    right:30%;
    top:80%;
    font-size:25px;
    animation-delay:1.2s;
}

@keyframes starFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(0);
        opacity:.4;
    }

    50%{
        transform:
            translateY(-25px)
            rotate(15deg);

        opacity:1;

        filter:
            drop-shadow(0 0 8px white)
            drop-shadow(0 0 18px var(--cyan));
    }
}

/* =====================================================
   PLANETS
===================================================== */

.spacePlanet,
.saturn{
    position:fixed;

    border-radius:50%;

    pointer-events:none;

    z-index:1;
}

.spacePlanet{
    animation:
        planetFloat 8s ease-in-out infinite;
}

.planetBlue{
    width:75px;
    height:75px;

    top:20%;
    left:-20px;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff,
            #56eaff 15%,
            #267aff 45%,
            #16206e 75%,
            #050512
        );

    box-shadow:
        0 0 20px var(--cyan),
        0 0 50px rgba(0,246,255,.4);
}

.planetPurple{
    width:55px;
    height:55px;

    right:7%;
    top:43%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffd9ff,
            #b967ff 30%,
            #6425c9 65%,
            #15062d
        );

    box-shadow:
        0 0 25px var(--purple);
}

.planetYellow{
    width:42px;
    height:42px;

    left:11%;
    bottom:18%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff,
            #ffe45c 30%,
            #ff9d00 70%,
            #501600
        );

    box-shadow:
        0 0 20px var(--yellow);
}

@keyframes planetFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(0);
    }

    50%{
        transform:
            translateY(-35px)
            rotate(180deg);
    }
}

/* =====================================================
   SATURN
===================================================== */

.saturn{
    right:2%;
    bottom:8%;

    width:100px;
    height:100px;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff5c4,
            #e4b55b 25%,
            #a96b32 60%,
            #29130c
        );

    box-shadow:
        0 0 25px rgba(255,200,100,.5);

    animation:
        saturnFloat 7s ease-in-out infinite;
}

.saturn:before{
    content:"";

    position:absolute;

    width:165px;
    height:45px;

    left:-33px;
    top:28px;

    border:
        6px solid rgba(255,220,130,.55);

    border-radius:50%;

    transform:rotate(-15deg);

    box-shadow:
        0 0 15px rgba(255,220,130,.4);
}

@keyframes saturnFloat{

    50%{
        transform:
            translateY(-25px)
            rotate(8deg);
    }
}

/* =====================================================
   UFO
===================================================== */

.ufo{
    position:fixed;

    right:-140px;
    top:18%;

    font-size:65px;

    z-index:8;

    pointer-events:none;

    animation:
        ufoFly 14s linear infinite;

    filter:
        drop-shadow(0 0 8px white)
        drop-shadow(0 0 15px var(--cyan))
        drop-shadow(0 0 35px var(--purple));
}

.ufo:after{
    content:"";

    position:absolute;

    width:80px;
    height:35px;

    left:18px;
    top:55px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,246,255,.7),
            transparent
        );

    filter:blur(8px);

    transform:
        perspective(100px)
        rotateX(55deg);
}

@keyframes ufoFly{

    0%{
        transform:
            translate(0,0)
            rotate(-5deg);
    }

    25%{
        transform:
            translate(-25vw,90px)
            rotate(8deg);
    }

    50%{
        transform:
            translate(-55vw,-70px)
            rotate(-8deg);
    }

    75%{
        transform:
            translate(-85vw,100px)
            rotate(5deg);
    }

    100%{
        transform:
            translate(-125vw,-50px)
            rotate(-5deg);
    }
}

/* =====================================================
   CAT
===================================================== */

.spaceCat{
    position:fixed;

    right:-130px;
    top:58%;

    font-size:70px;

    z-index:7;

    pointer-events:none;

    filter:
        drop-shadow(0 0 8px white)
        drop-shadow(0 0 20px var(--cyan))
        drop-shadow(0 0 35px var(--purple));

    animation:
        catFly 19s linear infinite;
}

@keyframes catFly{

    0%{
        transform:
            translate(0,0)
            rotate(-5deg);
    }

    25%{
        transform:
            translate(-25vw,-70px)
            rotate(8deg);
    }

    50%{
        transform:
            translate(-55vw,40px)
            rotate(-5deg);
    }

    75%{
        transform:
            translate(-85vw,-80px)
            rotate(8deg);
    }

    100%{
        transform:
            translate(-125vw,20px)
            rotate(-5deg);
    }
}

/* =====================================================
   ROCKETS
===================================================== */

.rocket{
    position:fixed;

    z-index:10;

    pointer-events:none;

    font-size:58px;

    filter:
        drop-shadow(0 0 5px white)
        drop-shadow(0 0 15px var(--cyan))
        drop-shadow(0 0 30px var(--pink));
}

.rocket:after{
    content:"";

    position:absolute;

    width:22px;
    height:65px;

    left:19px;
    bottom:-48px;

    border-radius:
        50% 50% 65% 65%;

    background:
        linear-gradient(
            to bottom,
            #fff,
            #ffe45c 20%,
            #ff8c00 50%,
            #ff2b00 75%,
            transparent
        );

    filter:
        blur(3px)
        drop-shadow(0 0 8px #ffe45c)
        drop-shadow(0 0 18px #ff5a00);

    animation:
        engineFire .12s ease-in-out infinite alternate;
}

@keyframes engineFire{

    from{
        height:45px;
        opacity:.7;
    }

    to{
        height:75px;
        opacity:1;
    }
}

.rocket1{
    left:-120px;
    top:30%;

    animation:
        rocketFly1 11s linear infinite;
}

.rocket2{
    right:-120px;
    top:70%;

    font-size:48px;

    animation:
        rocketFly2 14s linear infinite;
}

.rocket3{
    left:20%;
    bottom:-100px;

    font-size:42px;

    animation:
        rocketFly3 10s linear infinite;
}

@keyframes rocketFly1{

    0%{
        transform:
            translate(0,0)
            rotate(25deg);
    }

    50%{
        transform:
            translate(55vw,-150px)
            rotate(25deg);
    }

    100%{
        transform:
            translate(120vw,-300px)
            rotate(25deg);
    }
}

@keyframes rocketFly2{

    0%{
        transform:
            translate(0,0)
            rotate(-25deg);
    }

    50%{
        transform:
            translate(-55vw,-100px)
            rotate(-25deg);
    }

    100%{
        transform:
            translate(-125vw,-200px)
            rotate(-25deg);
    }
}

@keyframes rocketFly3{

    0%{
        transform:
            translateY(0)
            rotate(-20deg);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:
            translateY(-120vh)
            rotate(-20deg);

        opacity:0;
    }
}

/* =====================================================
   LOADER
===================================================== */

#loader{
    position:fixed;
    inset:0;

    z-index:999999;

    display:grid;
    place-items:center;

    background:
        radial-gradient(
            circle at center,
            #11174b 0%,
            #05051a 45%,
            #01020b 100%
        );

    transition:
        opacity .45s ease,
        visibility .45s ease;
}

#loader.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loaderBox{
    width:min(90%,420px);
    text-align:center;
}

.loaderPlanet{
    width:90px;
    height:90px;

    margin:auto;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff 0%,
            #55eaff 18%,
            #6540ef 58%,
            #09021d 100%
        );

    box-shadow:
        0 0 25px var(--cyan),
        0 0 60px var(--purple);

    animation:
        loaderSpin 1.2s linear infinite;
}

@keyframes loaderSpin{
    to{
        transform:rotate(360deg);
    }
}

.loaderTitle{
    margin-top:18px;

    font-size:
        clamp(1.8rem,7vw,3.2rem);

    font-weight:950;
}

.loaderText{
    margin-top:8px;

    color:var(--cyan);

    font-weight:800;
}

.loaderBar{
    width:min(270px,80vw);

    height:5px;

    margin:
        18px auto 0;

    overflow:hidden;

    border-radius:999px;

    background:
        rgba(255,255,255,.1);
}

.loaderBar i{
    display:block;

    width:0;
    height:100%;

    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--purple),
            var(--pink)
        );

    animation:
        loadFast .7s ease-out forwards;
}

@keyframes loadFast{
    to{
        width:100%;
    }
}

/* =====================================================
   HEADER
===================================================== */

header{
    position:sticky;

    top:0;

    z-index:500;

    background:
        rgba(2,3,13,.75);

    border-bottom:
        1px solid var(--border);

    backdrop-filter:
        blur(20px);
}

nav{
    min-height:72px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.container{
    width:
        min(
            calc(100% - 32px),
            var(--max)
        );

    margin:auto;
}

.logo{
    border:0;
    background:none;

    color:#fff;

    font-weight:950;
    font-size:1.3rem;

    cursor:pointer;

    text-shadow:
        0 0 15px var(--cyan);
}

.logo b{
    color:var(--cyan);
}

.nav{
    display:flex;

    gap:4px;

    list-style:none;
}

.nav button,
.mobileBtn{
    border:0;

    background:transparent;

    color:var(--soft);

    cursor:pointer;

    padding:
        10px 12px;

    border-radius:12px;

    font-weight:850;

    transition:.25s;
}

.nav button:hover,
.nav button.active{
    color:var(--cyan);

    background:
        rgba(0,246,255,.08);

    box-shadow:
        0 0 20px rgba(0,246,255,.15);
}

.mobileBtn{
    display:none;

    font-size:1.6rem;
}

.mobileMenu{
    display:none;

    padding:
        8px 0 14px;
}

.mobileMenu.open{
    display:block;
}

.mobileMenu button{
    width:100%;

    text-align:left;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.04);

    color:#fff;

    padding:13px;

    border-radius:12px;

    margin-top:6px;

    cursor:pointer;
}

/* =====================================================
   PAGE
===================================================== */

main{
    position:relative;
    z-index:20;
}

.page{
    display:none;

    min-height:
        calc(100vh - 72px);

    padding:
        80px 0 100px;

    animation:
        pageIn .5s ease;
}

.page.active{
    display:block;
}

@keyframes pageIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

/* =====================================================
   HERO
===================================================== */

.hero{
